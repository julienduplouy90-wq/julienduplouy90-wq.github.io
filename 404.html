<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | Tambouloup</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<style>
:root{--night:#102124;--amber:#eea35a;--cream:#f7efde}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--cream);font-family:"DM Sans",Arial,sans-serif;min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;opacity:.2;background-image:radial-gradient(#f7efde8c .75px,#0000 .8px);background-size:20px 20px}
.moon{position:absolute;bottom:-18%;right:-8%;width:420px;aspect-ratio:1;border:1px solid #eea35a45;border-radius:50%;box-shadow:0 0 0 40px #eea35a09,0 0 0 80px #eea35a06}
main{position:relative}
.mark{color:var(--amber);font-size:3.4rem;display:inline-block;transform:rotate(-20deg);line-height:1}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.04em;font-size:clamp(2.4rem,6vw,4.4rem);margin:1.2rem 0 .8rem}
h1 em{color:var(--amber);font-style:italic;font-weight:400}
p{color:#f7efdeb8;max-width:440px;margin:0 auto;line-height:1.7}
a.back{display:inline-flex;align-items:center;gap:.6rem;margin-top:2rem;background:var(--amber);color:var(--night);text-decoration:none;font-weight:700;letter-spacing:.09em;text-transform:uppercase;font-size:.74rem;border-radius:999px;padding:.95rem 1.6rem;transition:transform .2s}
a.back:hover{transform:translateY(-3px)}
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<main>
  <span class="mark" aria-hidden="true">◒</span>
  <h1>Ce chemin mène<br><em>hors des mondes.</em></h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
  <a class="back" href="/">Revenir à l'accueil <span aria-hidden="true">↖</span></a>
</main>
</body>
</html>
