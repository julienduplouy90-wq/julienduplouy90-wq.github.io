<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <!-- Styles intégrés : cette page doit s'afficher correctement
       quelle que soit l'URL demandée, même profonde. -->
  <style>
    :root { --bg:#f6f4ee; --ink:#1d2622; --ink-soft:#58645d; --green:#1e4230; --green-dark:#14301f; --green-tint:#e3ebe1; }
    *,*::before,*::after { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      padding:32px 20px; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      line-height:1.65; text-align:center;
    }
    .box { max-width:520px; }
    .mark {
      width:52px; height:52px; border-radius:14px; background:var(--green);
      display:grid; place-items:center; margin:0 auto 26px; color:#fff;
    }
    h1 { font-family:Georgia,"Times New Roman",serif; font-weight:600;
         font-size:clamp(1.6rem,5vw,2.2rem); letter-spacing:-0.015em; margin:0 0 12px; }
    p { color:var(--ink-soft); margin:0 0 26px; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      background:var(--green); color:#fff; text-decoration:none;
      border-radius:999px; padding:14px 26px; font-weight:620;
      box-shadow:0 8px 20px -8px rgba(30,66,48,.55);
    }
    .btn:hover { background:var(--green-dark); }
    .alt { margin-top:20px; font-size:.9rem; }
    .alt a { color:var(--green); }
  </style>
</head>
<body>
  <div class="box">

    </div>

    <p class="alt">Une question&nbsp;? <a href="mailto:julien.duplouy90@gmail.com">Écrivez-moi directement</a>.</p>
  </div>
</body>
</html>
